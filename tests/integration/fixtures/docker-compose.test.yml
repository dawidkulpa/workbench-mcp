# Docker Compose for Integration Tests
# Usage: docker compose -f tests/integration/fixtures/docker-compose.test.yml up -d

services:
  # Test sandbox image
  sandbox:
    build:
      context: ../../../containers/sandbox
      dockerfile: Dockerfile
    image: workbench-sandbox:test
    networks:
      - test-network
    command: ["tail", "-f", "/dev/null"]

  # Test proxy image
  proxy:
    build:
      context: ../../../containers/proxy
      dockerfile: Dockerfile
    image: workbench-proxy:test
    networks:
      - test-network
    environment:
      - PROXY_PORT=3128
      - PROXY_ALLOWLIST=httpbin.org,*.httpbin.org

networks:
  test-network:
    driver: bridge
    internal: true
